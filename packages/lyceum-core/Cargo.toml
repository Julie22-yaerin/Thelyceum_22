[package]
name = "lyceum-core"
version = "0.1.0"
edition = "2021"
description = "Rust state machine for context deduplication and token budget tracking, exposed to Python via PyO3 with zero-copy input."
license = "MIT"

[lib]
name = "lyceum_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py39"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
