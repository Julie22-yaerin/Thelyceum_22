<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .lbl { font-size: 15px; font-weight: 650; fill: #f2f3f7; }
    .sub { font-size: 12px; fill: #888ea3; }
    .val { font-size: 14px; font-weight: 650; fill: #f2f3f7; }
    .floor { font-size: 10px; fill: #888ea3; }
    .title { font-size: 13px; font-weight: 600; fill: #888ea3; letter-spacing: 0.02em; }
  </style>

  <rect x="0" y="0" width="760" height="400" rx="16" fill="#121620" stroke="#1e222c" stroke-width="1" />

  <text x="32" y="38" class="title">CLOUD THROUGHPUT — GITHUB ACTIONS, X64 — MEASURED, NOT SIMULATED</text>

  <!-- brake -->
  <text x="32" y="96" class="lbl">brake</text>
  <text x="32" y="114" class="sub">stops the action</text>
  <rect x="180" y="78" width="540" height="34" rx="8" fill="#1a1e28" />
  <rect x="180" y="78" width="507" height="34" rx="8" fill="#ff4438" />
  <text x="700" y="100" text-anchor="end" class="val">1.45M/sec</text>
  <line x1="352" y1="78" x2="352" y2="112" stroke="#f2f3f7" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="352" y="126" text-anchor="middle" class="floor">floor 200k (7.3×)</text>

  <!-- redteam -->
  <text x="32" y="196" class="lbl">redteam</text>
  <text x="32" y="214" class="sub">stops the argument</text>
  <rect x="180" y="178" width="540" height="34" rx="8" fill="#1a1e28" />
  <rect x="180" y="178" width="345" height="34" rx="8" fill="#a78bfa" />
  <text x="700" y="200" text-anchor="end" class="val">295.3k/sec</text>
  <line x1="288" y1="178" x2="288" y2="212" stroke="#f2f3f7" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="288" y="226" text-anchor="middle" class="floor">floor 100k (2.9×)</text>

  <!-- thrift -->
  <text x="32" y="296" class="lbl">thrift</text>
  <text x="32" y="314" class="sub">stops the bill</text>
  <rect x="180" y="278" width="540" height="34" rx="8" fill="#1a1e28" />
  <rect x="180" y="278" width="159" height="34" rx="8" fill="#fbbf24" />
  <text x="700" y="300" text-anchor="end" class="val">47.5k/sec</text>
  <line x1="222" y1="278" x2="222" y2="312" stroke="#f2f3f7" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="222" y="326" text-anchor="middle" class="floor">floor 8k (5.9×)</text>

  <!-- footer stat -->
  <line x1="32" y1="356" x2="728" y2="356" stroke="#1e222c" stroke-width="1" />
  <text x="32" y="382" class="sub">Bar scale is logarithmic — dashed line marks the CI floor each tool must clear to ship.</text>
  <text x="728" y="382" text-anchor="end" class="val">274/274 tests passing</text>
</svg>
