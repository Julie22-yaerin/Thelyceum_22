<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your account — The Lyceum</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/web/logo.png" />
  <link rel="stylesheet" href="/web/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="/" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;">
        <img src="/web/logo.png" alt="The Lyceum" class="logo-img" />
        <span class="name">The Lyceum</span>
      </a>
    </div>
  </header>

  <main>
    <section class="waitlist-section" id="redeemSection">
      <!-- All three views (entry form, quickstart wizard, dashboard) render
           into #redeemCard below — redeem.js decides which one, based on
           whether a key is stored locally and whether the server has ever
           seen a real CLI check in with it. -->
      <div class="waitlist-card" id="redeemCard"></div>
    </section>
  </main>

  <footer>
    <p>Lost your code or it expired? <a href="/web/#book-a-call">Book a call</a> on the homepage.</p>
  </footer>

  <script src="/web/redeem.js" type="module"></script>
</body>
</html>
