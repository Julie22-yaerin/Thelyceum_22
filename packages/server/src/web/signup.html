<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create your account — The Lyceum</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/web/logo.png" />
  <link rel="stylesheet" href="/web/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="/web/" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;">
        <img src="/web/logo.png" alt="The Lyceum" class="logo-img" />
        <span class="name">The Lyceum</span>
      </a>
    </div>
    <nav class="nav">
      <a href="/web/pricing">Pricing</a>
      <a href="/web/redeem" class="nav-cta">Have a key already?</a>
    </nav>
  </header>

  <main>
    <section class="waitlist-section">
      <div class="waitlist-card" id="signupCard">
        <h2>Create your account</h2>
        <p class="sub">One month, on us — verify your email and you'll have a license key immediately.</p>

        <button type="button" id="googleBtn" class="google-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
        <p class="muted small" style="text-align:center; margin-bottom:16px;">— or —</p>

        <form class="waitlist-form" id="emailForm" novalidate>
          <label>Name
            <input type="text" name="name" required autocomplete="name" />
          </label>
          <label>Email
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label>Password
            <input type="password" name="password" required autocomplete="new-password" minlength="8" />
          </label>
          <button type="submit" id="emailSubmit">Sign up</button>
          <p style="text-align:center; font-size:13px;">
            Already have an account? <a href="#" id="toggleSignin">Sign in instead</a>
          </p>
          <p class="field-error" id="signupError" style="text-align:center;"></p>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>brake stops the action, redteam attacks the argument, thrift stops the bill.</p>
  </footer>

  <script src="/web/signup.js" type="module"></script>
</body>
</html>
